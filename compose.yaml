name: kv-cluster

services:
  node1:
    image: kv-store:1.0
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - node1-data:/data

  node2:
    image: kv-store:1.0
    init: true
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - node2-data:/data

  node3:
    image: kv-store:1.0
    init: true
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - node3-data:/data

  router:
    image: kv-router:1.0
    build:
      context: .
      dockerfile: Dockerfile.router
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--node"
      - "node1=node1:8080"
      - "--node"
      - "node2=node2:8080"
      - "--node"
      - "node3=node3:8080"
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy

volumes:
  node1-data:
  node2-data:
  node3-data: